name: Build Floating Ball Version

on:
  push:
    branches:
      - floating-ball
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: nuget restore ${{env.SOLUTION_FILE_PATH}}
        
      - name: Build Release x64
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
        
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with: 
          name: Ditto-FloatingBall-EXE
          retention-days: 7
          path: |
            Release64/Ditto.exe
            Release64/ICU_Loader.dll
            Release64/Addins/DittoUtil.dll
            
      - name: Build Debug x64
        run: msbuild CP_Main_10.sln /p:Configuration=Debug /p:Platform=x64
        
      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with: 
          name: Ditto-FloatingBall-Debug
          retention-days: 7
          path: |
            Debug64/Ditto.exe
            Debug64/Ditto.pdb
            Debug64/ICU_Loader.dll
            Debug64/Addins/DittoUtil.dll
